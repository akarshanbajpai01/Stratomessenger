<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minimal Chat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: #f5f5f5;
}

/* Name screen */

#loginScreen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 350px;
}

.loginBox h1 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.loginBox button {
    width: 100%;
    margin-top: 10px;
    background: black;
    color: white;
}

/* Chat */

#chatScreen {
    display: none;
    height: 100vh;
    flex-direction: column;
}

header {
    padding: 16px;
    background: black;
    color: white;
    font-size: 18px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: white;
}

.message.mine {
    margin-left: auto;
    background: black;
    color: white;
}

.sender {
    font-size: 12px;
    margin-bottom: 4px;
    opacity: 0.7;
}

#messageForm {
    display: flex;
    padding: 10px;
    gap: 8px;
    background: white;
}

#messageInput {
    flex: 1;
}

#messageForm button {
    background: black;
    color: white;
}
</style>

</head>

<body>

<!-- NAME SCREEN -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>Chat</h1>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name"
        >

        <button onclick="enterChat()">
            Enter Chat
        </button>

    </div>

</div>


<!-- CHAT SCREEN -->

<div id="chatScreen">

    <header id="chatTitle">
        Chat
    </header>

    <div id="messages"></div>

    <form id="messageForm">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>


<script>

/* =========================
   CONFIGURATION
========================= */

const API_URL = "https://script.google.com/macros/s/AKfycbx2pBQa38W6jne5kwNVEnfGvnxewiJ-fqY9TLFzuSOklv5ZH1KDyoBmFdYdK2YkDuQN/exec";


/* =========================
   USER
========================= */

let username = localStorage.getItem("chatUsername");


/* =========================
   ELEMENTS
========================= */

const loginScreen = document.getElementById("loginScreen");
const chatScreen = document.getElementById("chatScreen");

const nameInput = document.getElementById("nameInput");

const messagesContainer =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const messageForm =
    document.getElementById("messageForm");


/* =========================
   ENTER CHAT
========================= */

function enterChat() {

    const name = nameInput.value.trim();

    if (!name) return;

    username = name;

    localStorage.setItem(
        "chatUsername",
        username
    );

    openChat();
}


function openChat() {

    loginScreen.style.display = "none";

    chatScreen.style.display = "flex";

    document.getElementById(
        "chatTitle"
    ).textContent = "Chat";

    loadMessages();
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    try {

        const response =
            await fetch(API_URL);

        const messages =
            await response.json();

        messagesContainer.innerHTML = "";

        messages.forEach(msg => {

            const messageDiv =
                document.createElement("div");

            messageDiv.className = "message";

            if (
                msg.sender === username
            ) {
                messageDiv.classList.add("mine");
            }

            const sender =
                document.createElement("div");

            sender.className = "sender";

            sender.textContent =
                msg.sender;

            const text =
                document.createElement("div");

            text.textContent =
                msg.message;

            messageDiv.appendChild(sender);

            messageDiv.appendChild(text);

            messagesContainer.appendChild(
                messageDiv
            );

        });

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

    }

    catch (error) {

        console.error(
            "Could not load messages:",
            error
        );

    }

}


/* =========================
   SEND MESSAGE
========================= */

messageForm.addEventListener(
    "submit",

    async function(event) {

        event.preventDefault();

        const message =
            messageInput.value.trim();

        if (!message) return;

        messageInput.value = "";

        try {

            await fetch(API_URL, {

                method: "POST",

                body: JSON.stringify({

                    sender: username,

                    message: message

                })

            });

            loadMessages();

        }

        catch (error) {

            console.error(
                "Could not send message:",
                error
            );

        }

    }

);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    loadMessages,
    3000
);


/* =========================
   AUTO LOGIN
========================= */

if (username) {

    openChat();

}

</script>

</body>
</html>
